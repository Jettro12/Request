version: "3.9"

networks:
  microservices-net:
    driver: bridge

volumes:
  pg_data:

services:
  # ===============================
  # INFRAESTRUCTURA
  # ===============================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks:
      - microservices-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-net

  # ===============================
  # MICROSERVICIOS
  # ===============================
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/authdb
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      PORT: 4004
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  users-service:
    build: ./services/users-service
    container_name: users-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/usersdb
      PORT: 4007
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  posts-service:
    build: ./services/posts-service
    container_name: posts-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postsdb
      KAFKA_BROKER: kafka:9092
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  requests-service:
    build: ./services/requests-service
    container_name: requests-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/requestsdb
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notificationsdb
      PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  profile-service:
    build: ./services/profile-service
    container_name: profile-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/profiledb
      PORT: 4005
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  ratings-service:
    build: ./services/ratings-service
    container_name: ratings-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ratingsdb
      PORT: 4006
    ports:
      - "4006:4006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  messages-service:
    build: ./services/messages-service
    container_name: messages-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/messagesdb
      PORT: 4008
    ports:
      - "4008:4008"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  conversations-service:
    build: ./services/conversations-service
    container_name: conversations-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/conversationsdb
      PORT: 4009
    ports:
      - "4009:4009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  chat-service:
    build: ./services/chat-service
    container_name: chat-service
    environment:
      PORT: 4010
    ports:
      - "4010:4010"
    networks:
      - microservices-net

  # ===============================
  # FRONTEND
  # ===============================
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost
        NEXTAUTH_URL: http://localhost:3000
        NEXTAUTH_SECRET: super-secret-prod
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - users-service
      - posts-service
      - requests-service
    networks:
      - microservices-net
