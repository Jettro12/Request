name: Deploy APPS (Distributed)

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # JOB 1: CONSTRUIR (Igual que antes)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            path: ./services/auth-service
          - name: users-service
            path: ./services/users-service
          - name: posts-service
            path: ./services/posts-service
          - name: requests-service
            path: ./services/requests-service
          - name: notification-service
            path: ./services/notification-service
          - name: profile-service
            path: ./services/profile-service
          - name: ratings-service
            path: ./services/ratings-service
          - name: messages-service
            path: ./services/messages-service
          - name: conversations-service
            path: ./services/conversations-service
          - name: chat-service
            path: ./services/chat-service
          - name: frontend
            path: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Downcase Image Name
        run: echo "IMAGE_NAME=${REGISTRY}/${OWNER,,}/${{ matrix.service.name }}:latest" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 2: DESPLEGAR EN NODO 1 (Frontend + Auth)
  deploy-node-1:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Compose Node 1
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.NODE_1_PRIVATE_IP }} # IP NUEVA
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-node1.yml"
          target: "~/apps"

      - name: Deploy Node 1
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.NODE_1_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p ~/apps && cd ~/apps
            # Usamos el archivo de Node 1
            mv docker-compose-node1.yml docker-compose.yaml

            # El secreto ENV_FILE_NODE1 debe tener DB_HOST=db.internal.app
            echo "${{ secrets.ENV_FILE_COMMON }}" > .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # JOB 3: DESPLEGAR EN NODO 2 (Logica de Negocio)
  deploy-node-2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Compose Node 2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.NODE_2_PRIVATE_IP }} # IP NUEVA
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-node2.yml"
          target: "~/apps"

      - name: Deploy Node 2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.NODE_2_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p ~/apps && cd ~/apps
            # Usamos el archivo de Node 2
            mv docker-compose-node2.yml docker-compose.yaml

            echo "${{ secrets.ENV_FILE_COMMON }}" > .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
