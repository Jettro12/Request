name: CI/CD Microservices AWS

on:
  push:
    branches:
      - fix-microservices
    paths:
      - services/**
      - frontend/**
      - nginx/**
      - terraform/**
      - .github/workflows/**

permissions:
  contents: read
  packages: write

# =========================
# 1️⃣ DETECTAR CAMBIOS
# =========================
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      users: ${{ steps.filter.outputs.users }}
      posts: ${{ steps.filter.outputs.posts }}
      requests: ${{ steps.filter.outputs.requests }}
      notification: ${{ steps.filter.outputs.notification }}
      profile: ${{ steps.filter.outputs.profile }}
      ratings: ${{ steps.filter.outputs.ratings }}
      messages: ${{ steps.filter.outputs.messages }}
      conversations: ${{ steps.filter.outputs.conversations }}
      chat: ${{ steps.filter.outputs.chat }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: ['services/auth-service/**']
            users: ['services/users-service/**']
            posts: ['services/posts-service/**']
            requests: ['services/requests-service/**']
            notification: ['services/notification-service/**']
            profile: ['services/profile-service/**']
            ratings: ['services/ratings-service/**']
            messages: ['services/messages-service/**']
            conversations: ['services/conversations-service/**']
            chat: ['services/chat-service/**']
            frontend: ['frontend/**']
            nginx: ['nginx/**']

  # =========================
  # 2️⃣ TESTS UNITARIOS
  # =========================
  unit-tests:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            auth,
            users,
            posts,
            requests,
            notification,
            profile,
            ratings,
            messages,
            conversations,
            chat,
          ]

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          node-version: 18

      - name: Install dependencies
        if: needs.changes.outputs[matrix.service] == 'true'
        run: |
          cd services/${{ matrix.service }}-service
          npm ci

      - name: Run unit tests
        if: needs.changes.outputs[matrix.service] == 'true'
        run: |
          cd services/${{ matrix.service }}-service
          npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret

  # =========================
  # 3️⃣ TESTS FUNCIONALES
  # =========================
  functional-tests:
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

    strategy:
      matrix:
        service: [auth, users, requests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}-service
          npm ci

      - name: Run functional tests
        run: |
          cd services/${{ matrix.service }}-service
          npm run test:integration -- --passWithNoTests || echo "No integration tests"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          NODE_ENV: test
          JWT_SECRET: test-secret

  # =========================
  # 4️⃣ BUILD & PUSH DOCKER
  # =========================
  build-and-push:
    needs: [changes, functional-tests]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          [
            auth,
            users,
            posts,
            requests,
            notification,
            profile,
            ratings,
            messages,
            conversations,
            chat,
            frontend,
            nginx,
          ]

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.service] == 'true'

      - name: Build & Push image
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ matrix.service == 'frontend' && './frontend' ||
                matrix.service == 'nginx' && './nginx' ||
                format('./services/{0}-service', matrix.service) }}
          push: true
          tags: ghcr.io/jettro12/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================
  # 5️⃣ DEPLOY AWS (ASG)
  # =========================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix-microservices'

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Trigger rolling update (Auto Scaling Group)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name request-app-asg \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":120}'
