name: Test, Build and Deploy Microservices

on:
  push:
    branches:
      - fix-microservices
    paths:
      - services/**
      - frontend/**
      - nginx/**
      - .github/workflows/**

permissions:
  contents: read
  packages: write

# ==========================================
# DETECTAR CAMBIOS
# ==========================================
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      users: ${{ steps.filter.outputs.users }}
      posts: ${{ steps.filter.outputs.posts }}
      requests: ${{ steps.filter.outputs.requests }}
      notification: ${{ steps.filter.outputs.notification }}
      profile: ${{ steps.filter.outputs.profile }}
      ratings: ${{ steps.filter.outputs.ratings }}
      messages: ${{ steps.filter.outputs.messages }}
      conversations: ${{ steps.filter.outputs.conversations }}
      chat: ${{ steps.filter.outputs.chat }}
      files: ${{ steps.filter.outputs.files }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: ['services/auth-service/**']
            users: ['services/users-service/**']
            posts: ['services/posts-service/**']
            requests: ['services/requests-service/**']
            notification: ['services/notification-service/**']
            profile: ['services/profile-service/**']
            ratings: ['services/ratings-service/**']
            messages: ['services/messages-service/**']
            conversations: ['services/conversations-service/**']
            chat: ['services/chat-service/**']
            files: ['services/files-service/**']
            frontend: ['frontend/**']
            nginx: ['nginx/**']

  # ==========================================
  # TESTS MICROSERVICIOS
  # ==========================================
  test-services:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            auth,
            users,
            posts,
            requests,
            notification,
            profile,
            ratings,
            messages,
            conversations,
            chat,
            files,
          ]

    steps:
      - name: Checkout
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: needs.changes.outputs[matrix.service] == 'true'
        run: |
          cd services/${{ matrix.service }}-service
          npm install

      - name: Run unit & integration tests
        if: needs.changes.outputs[matrix.service] == 'true'
        run: |
          cd services/${{ matrix.service }}-service
          npm test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          PORT: 0

  # ==========================================
  # TEST FRONTEND
  # ==========================================
  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          cd frontend
          npm install
          npm run lint || true
          npm test -- --passWithNoTests || true
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ==========================================
  # BUILD & PUSH DOCKER
  # ==========================================
  build-and-push:
    needs: [test-services, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            auth,
            users,
            posts,
            requests,
            notification,
            profile,
            ratings,
            messages,
            conversations,
            chat,
            files,
            frontend,
            nginx,
          ]

    steps:
      - name: Checkout
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ matrix.service == 'frontend' && './frontend' ||
                matrix.service == 'nginx' && './nginx' ||
                format('./services/{0}-service', matrix.service) }}
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          tags: |
            ghcr.io/jettro12/${{
              matrix.service == 'frontend' && 'frontend' ||
              matrix.service == 'nginx' && 'nginx' ||
              format('{0}-service', matrix.service)
            }}:latest

  # ==========================================
  # DEPLOY (AWS / TERRAFORM / ECS / EC2)
  # ==========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix-microservices'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy infrastructure with Terraform
        run: |
          echo "🚀 Aquí va terraform init / plan / apply"
          echo "terraform init"
          echo "terraform apply -auto-approve"

      - name: Post-deploy health check
        run: |
          echo "✅ Deployment finalizado"
