name: Deploy Microservices with NX

on:
  push:
    branches:
      - 'fix-microservices'

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      affected: ${{ steps.affected.outputs.affected }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Get affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx print-affected --base=HEAD~1 --head=HEAD --target=build --select=projects --json)
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected projects: $AFFECTED"

      - name: Build affected projects
        run: npx nx affected:build

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.build.outputs.affected) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ 
              matrix.project == 'request-app-frontend' && './frontend' ||
              matrix.project == 'nginx' && './nginx' ||
              format('./services/{0}', matrix.project)
            }}
          push: true
          tags: ghcr.io/jettro12/${{ matrix.project }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
