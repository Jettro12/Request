name: Deploy Microservices with NX

on:
  push:
    branches:
      - 'fix-microservices'

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install

      - name: Get affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --base=HEAD~1 --head=HEAD --json || echo "[]")
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT

      - name: Build affected projects
        run: npx nx affected --target=build || echo "No build targets"

  docker:
    needs: build
    if: needs.build.outputs.affected != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.build.outputs.affected) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ 
              matrix.project == 'request-app-frontend' && './frontend' ||
              matrix.project == 'nginx' && './nginx' ||
              format('./services/{0}', matrix.project)
            }}
          push: true
          tags: ghcr.io/jettro12/${{ matrix.project }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
