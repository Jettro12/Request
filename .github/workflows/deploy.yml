name: Deploy Microservices to AWS

on:
  push:
    branches:
      - "fix-microservices"
    paths:
      - "services/**"
      - "frontend/**"
      - "nginx/**"
      - ".github/workflows/**"

permissions:
  packages: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      users: ${{ steps.filter.outputs.users }}
      posts: ${{ steps.filter.outputs.posts }}
      requests: ${{ steps.filter.outputs.requests }}
      notifications: ${{ steps.filter.outputs.notifications }}
      profile: ${{ steps.filter.outputs.profile }}
      ratings: ${{ steps.filter.outputs.ratings }}
      messages: ${{ steps.filter.outputs.messages }}
      conversations: ${{ steps.filter.outputs.conversations }}
      chat: ${{ steps.filter.outputs.chat }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: ['services/auth-service/**']
            users: ['services/users-service/**']
            posts: ['services/posts-service/**']
            requests: ['services/requests-service/**']
            notifications: ['services/notification-service/**']
            profile: ['services/profile-service/**']
            ratings: ['services/ratings-service/**']
            messages: ['services/messages-service/**']
            conversations: ['services/conversations-service/**']
            chat: ['services/chat-service/**']
            frontend: ['frontend/**']
            nginx: ['nginx/**']

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            auth,
            users,
            posts,
            requests,
            notifications,
            profile,
            ratings,
            messages,
            conversations,
            chat,
            frontend,
            nginx,
          ]
    steps:
      - name: Checkout
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ matrix.service == 'frontend' && './frontend' || 
                matrix.service == 'nginx' && './nginx' || 
                format('./services/{0}-service', matrix.service) }}
          push: true
          tags: ghcr.io/jettro12/${{ matrix.service == 'notifications' && 'notification' || matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Refresh ASG Instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name request-app-asg \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 300}'
