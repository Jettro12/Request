name: Deploy Microservices to AWS

on:
  push:
    branches:
      - "fix-microservices" # <--- Asegúrate que esta es tu rama de trabajo

permissions:
  packages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Iniciar sesión en GitHub Packages (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 2. CONSTRUIR Y SUBIR IMAGENES (11 Servicios)
      # ==========================================

      # Backend Services
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/jettro12/auth-service:latest

      - name: Build and Push Users Service
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          push: true
          tags: ghcr.io/jettro12/users-service:latest

      - name: Build and Push Posts Service
        uses: docker/build-push-action@v5
        with:
          context: ./posts-service
          push: true
          tags: ghcr.io/jettro12/posts-service:latest

      - name: Build and Push Requests Service
        uses: docker/build-push-action@v5
        with:
          context: ./requests-service
          push: true
          tags: ghcr.io/jettro12/requests-service:latest

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ghcr.io/jettro12/notification-service:latest

      - name: Build and Push Profile Service
        uses: docker/build-push-action@v5
        with:
          context: ./profile-service
          push: true
          tags: ghcr.io/jettro12/profile-service:latest

      - name: Build and Push Ratings Service
        uses: docker/build-push-action@v5
        with:
          context: ./ratings-service
          push: true
          tags: ghcr.io/jettro12/ratings-service:latest

      - name: Build and Push Messages Service
        uses: docker/build-push-action@v5
        with:
          context: ./messages-service
          push: true
          tags: ghcr.io/jettro12/messages-service:latest

      - name: Build and Push Conversations Service
        uses: docker/build-push-action@v5
        with:
          context: ./conversations-service
          push: true
          tags: ghcr.io/jettro12/conversations-service:latest

      - name: Build and Push Chat Service
        uses: docker/build-push-action@v5
        with:
          context: ./chat-service
          push: true
          tags: ghcr.io/jettro12/chat-service:latest

      # Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/jettro12/frontend:latest

      # ==========================================
      # 3. DESPLIEGUE EN AWS (Instance Refresh)
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Refresh ASG Instances
        run: |
          echo "Iniciando refresco de instancias en AWS..."
          # Esto mata la instancia vieja y crea una nueva con las imagenes actualizadas
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name request-app-asg \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 300}'
