name: Deploy INFRA (Data Server)

on:
  push:
    branches: ["main", "feature/infra"]

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Copiar el archivo compose correcto
      - name: Copy Compose File
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DATA_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-data.yml" # NOMBRE NUEVO
          target: "~/infra"

      # 2. Configurar .env y Desplegar
      - name: Start Infra
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DATA_PRIVATE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Inyectamos secretos reales para que el compose los lea
          script: |
            mkdir -p ~/infra
            cd ~/infra

            # Crear .env con las credenciales necesarias
            echo "POSTGRES_USER=${{ secrets.DB_USER }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> .env
            echo "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}" >> .env

            # Renombrar y levantar
            mv docker-compose-data.yml docker-compose.yaml
            docker compose pull
            docker compose up -d
