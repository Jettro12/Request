version: "3.9"

networks:
  microservices-net:
    driver: bridge

services:
  # ===============================
  # ZOOKEEPER
  # ===============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  # ===============================
  # KAFKA
  # ===============================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 👇 MUY IMPORTANTE (esto era el problema)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-net

  # ===============================
  # API GATEWAY (NGINX)
  # ===============================
  api-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - posts-service
      - requests-service
      - profile-service
    networks:
      - microservices-net

  # ===============================
  # MICROSERVICIOS
  # ===============================
  auth-service:
    image: ghcr.io/jettro12/auth-service:latest
    container_name: auth-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4004
    networks:
      - microservices-net

  users-service:
    image: ghcr.io/jettro12/users-service:latest
    container_name: users-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4007
    networks:
      - microservices-net

  posts-service:
    image: ghcr.io/jettro12/posts-service:latest
    container_name: posts-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4002
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  requests-service:
    image: ghcr.io/jettro12/requests-service:latest
    container_name: requests-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4003
    networks:
      - microservices-net

  profile-service:
    image: ghcr.io/jettro12/profile-service:latest
    container_name: profile-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4005
    networks:
      - microservices-net

  notification-service:
    image: ghcr.io/jettro12/notification-service:latest
    container_name: notification-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4001
      KAFKA_BROKER: kafka:9092
      MQTT_BROKER: ${MQTT_BROKER}
    depends_on:
      - kafka
    networks:
      - microservices-net

  ratings-service:
    image: ghcr.io/jettro12/ratings-service:latest
    container_name: ratings-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4006
    networks:
      - microservices-net

  messages-service:
    image: ghcr.io/jettro12/messages-service:latest
    container_name: messages-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4008
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  conversations-service:
    image: ghcr.io/jettro12/conversations-service:latest
    container_name: conversations-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4009
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  chat-service:
    image: ghcr.io/jettro12/chat-service:latest
    container_name: chat-service
    restart: always
    env_file: [./.env]
    environment:
      PORT: 4010
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: ${REDIS_HOST}
    depends_on:
      - kafka
    networks:
      - microservices-net

  # ===============================
  # FRONTEND
  # ===============================
  frontend:
    image: ghcr.io/jettro12/frontend:latest
    container_name: frontend
    restart: always
    expose:
      - "3000"
    env_file: [./.env]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    networks:
      - microservices-net
