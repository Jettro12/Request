version: "3.9"

networks:
  microservices-net:
    driver: bridge

services:
  # ===============================
  # INFRAESTRUCTURA (Kafka, Zookeeper, RabbitMQ)
  # ===============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  kafka:
  image: confluentinc/cp-kafka:7.5.0
  container_name: kafka
  restart: always

  depends_on:
    zookeeper:
      condition: service_healthy

  ports:
    - "9092:9092" # opcional, útil para debug desde EC2

  environment:
    KAFKA_BROKER_ID: 1
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

    # Listener interno (docker network)
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  healthcheck:
    test:
      [
        "CMD",
        "kafka-broker-api-versions",
        "--bootstrap-server",
        "localhost:9092",
      ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

  networks:
    - microservices-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin_password # Cambia esto por tu contraseña real
    networks:
      - microservices-net

  # ===============================
  # API GATEWAY (NGINX)
  # ===============================
  api-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - posts-service
    networks:
      - microservices-net

  # ===============================
  # MICROSERVICIOS
  # ===============================
  # Se aplica el patrón: leer del env_file y pasar variables críticas

  auth-service:
    image: ghcr.io/jettro12/auth-service:latest
    container_name: auth-service
    restart: always
    env_file: [./.env]
    networks:
      - microservices-net

  users-service:
    image: ghcr.io/jettro12/users-service:latest
    container_name: users-service
    restart: always
    env_file: [./.env]
    networks:
      - microservices-net

  posts-service:
    image: ghcr.io/jettro12/posts-service:latest
    container_name: posts-service
    restart: always
    env_file: [./.env]
    depends_on:
    kafka:
      condition: service_healthy
    environment:
    KAFKA_BROKERS: kafka:9092
    networks:
      - microservices-net

  requests-service:
    image: ghcr.io/jettro12/requests-service:latest
    container_name: requests-service
    restart: always
    env_file: [./.env]
    networks:
      - microservices-net

  profile-service:
    image: ghcr.io/jettro12/profile-service:latest
    container_name: profile-service
    restart: always
    env_file: [./.env]
    networks:
      - microservices-net

  notification-service:
    image: ghcr.io/jettro12/notification-service:latest
    container_name: notification-service
    restart: always
    env_file: [./.env]
    depends_on:
      - kafka
    networks:
      - microservices-net

  ratings-service:
    image: ghcr.io/jettro12/ratings-service:latest
    container_name: ratings-service
    restart: always
    env_file: [./.env]
    networks:
      - microservices-net

  messages-service:
    image: ghcr.io/jettro12/messages-service:latest
    container_name: messages-service
    restart: always
    env_file: [./.env]
    depends_on:
      - kafka
    networks:
      - microservices-net

  conversations-service:
    image: ghcr.io/jettro12/conversations-service:latest
    container_name: conversations-service
    restart: always
    env_file: [./.env]
    depends_on:
      - kafka
    networks:
      - microservices-net

  chat-service:
    image: ghcr.io/jettro12/chat-service:latest
    container_name: chat-service
    restart: always
    env_file: [./.env]
    depends_on:
      - kafka
    networks:
      - microservices-net

  # ===============================
  # FRONTEND (Next.js)
  # ===============================
  frontend:
    image: ghcr.io/jettro12/frontend:latest
    container_name: frontend
    restart: always
    env_file: [./.env]
    # Inyectamos explícitamente estas para asegurar que Next.js las tome en runtime
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    networks:
      - microservices-net
