version: "3.9"

networks:
  microservices-net:
    driver: bridge

services:
  # ===============================
  # INFRAESTRUCTURA DE MENSAJERÍA
  # ===============================
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - microservices-net

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
    depends_on:
      - zookeeper
    networks:
      - microservices-net

  # ===============================
  # API GATEWAY (Nginx)
  # ===============================
  api-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net

  # ===============================
  # MICROSERVICIOS
  # ===============================
  auth-service:
    image: ghcr.io/jettro12/auth-service:latest
    container_name: auth-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4004
    networks:
      - microservices-net

  users-service:
    image: ghcr.io/jettro12/users-service:latest
    container_name: users-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4007
    networks:
      - microservices-net

  posts-service:
    image: ghcr.io/jettro12/posts-service:latest
    container_name: posts-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4002
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  requests-service:
    image: ghcr.io/jettro12/requests-service:latest
    container_name: requests-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4003
    networks:
      - microservices-net

  profile-service:
    image: ghcr.io/jettro12/profile-service:latest
    container_name: profile-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4005
    networks:
      - microservices-net

  notification-service:
    image: ghcr.io/jettro12/notification-service:latest
    container_name: notification-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4001
      - KAFKA_BROKER=kafka:9092
      - MQTT_BROKER=${MQTT_BROKER}
    depends_on:
      - kafka
    networks:
      - microservices-net

  ratings-service:
    image: ghcr.io/jettro12/ratings-service:latest
    container_name: ratings-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4006
    networks:
      - microservices-net

  messages-service:
    image: ghcr.io/jettro12/messages-service:latest
    container_name: messages-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4008
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  conversations-service:
    image: ghcr.io/jettro12/conversations-service:latest
    container_name: conversations-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4009
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net

  chat-service:
    image: ghcr.io/jettro12/chat-service:latest
    container_name: chat-service
    restart: always
    env_file: [./.env]
    environment:
      - PORT=4010
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      - kafka
    networks:
      - microservices-net

  # ===============================
  # FRONTEND
  # ===============================
  frontend:
    image: ghcr.io/jettro12/frontend:latest
    container_name: frontend
    restart: always
    expose:
      - "3000"
    env_file: [./.env]
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    networks:
      - microservices-net
