events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # DNS interno de Docker (resolución de nombres de contenedores)
    resolver 127.0.0.11 valid=30s;

    # Configuración para archivos grandes (necesario para files-service)
    client_max_body_size 100M;
    proxy_request_buffering off;
    proxy_buffering off;
    
    # Timeouts aumentados para uploads grandes
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    server {
        listen 80;
        server_name _;

        # -------------------------------
        # HEADERS BASE
        # -------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -------------------------------
        # HEALTH CHECK (ALB)
        # -------------------------------
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # -------------------------------
        # FILES SERVICE (puerto 4011) - CONFIGURACIÓN CORREGIDA
        # -------------------------------
        location /api/files/ {
            # IMPORTANTE: Proxy directo CON barra final
            proxy_pass http://files-service:4011/;
            
            # Configuraciones específicas para archivos grandes
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_buffering off;
            
            # Timeouts extendidos para uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Headers adicionales importantes
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Original-URI $request_uri;
            
            # Headers CORS para evitar problemas
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Manejar preflight OPTIONS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 = @files_unavailable;
        }

        # Ruta alternativa para files-service (por compatibilidad)
        location /files/ {
            proxy_pass http://files-service:4011/;
            
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_buffering off;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # -------------------------------
        # ERROR HANDLER PARA FILES SERVICE
        # -------------------------------
        location @files_unavailable {
            add_header Content-Type application/json;
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            return 503 '{"error": "Files service is temporarily unavailable. Please try again later."}';
        }

        # -------------------------------
        # MICROSERVICIOS REST
        # -------------------------------

        # USERS SERVICE
        location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # POSTS SERVICE
        location /api/posts {
            rewrite ^/api/posts/?(.*) /$1 break;
            proxy_pass http://posts-service:4002/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # REQUESTS SERVICE
        location /api/requests {
            rewrite ^/api/requests/?(.*) /$1 break;
            proxy_pass http://requests-service:4003/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # PROFILE SERVICE
        location /api/profile {
            rewrite ^/api/profile/?(.*) /$1 break;
            proxy_pass http://profile-service:4005/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # NOTIFICATIONS SERVICE
        location /api/notifications {
            rewrite ^/api/notifications/?(.*) /$1 break;
            proxy_pass http://notification-service:4001/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # MESSAGES SERVICE
        location /api/messages {
            rewrite ^/api/messages/?(.*) /$1 break;
            proxy_pass http://messages-service:4008/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # CONVERSATIONS SERVICE
        location /api/conversations {
            rewrite ^/api/conversations/?(.*) /$1 break;
            proxy_pass http://conversations-service:4009/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # RATINGS SERVICE
        location /api/ratings {
            rewrite ^/api/ratings/?(.*) /$1 break;
            proxy_pass http://ratings-service:4006/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # -------------------------------
        # AUTH SERVICE
        # -------------------------------

        location /api/auth-custom {
            rewrite ^/api/auth-custom/?(.*) /$1 break;
            proxy_pass http://auth-service:4004/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location /api/auth/register {
            rewrite ^/api/auth/register/?(.*) /register break;
            proxy_pass http://auth-service:4004/;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # -------------------------------
        # CHAT SERVICE (WebSocket) - YA EXISTE (puerto 4010)
        # -------------------------------

        location /api/chat {
            rewrite ^/api/chat/?(.*) /$1 break;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;

            proxy_pass http://chat-service:4010/;
            
            # Headers CORS para WebSocket
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Upgrade' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # -------------------------------
        # NEXTAUTH (Next.js interno)
        # -------------------------------

        location /api/auth/ {
            proxy_pass http://frontend:3000;
            
            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # -------------------------------
        # FRONTEND (Next.js)
        # -------------------------------

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}