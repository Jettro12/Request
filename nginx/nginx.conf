events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # DNS interno de Docker para resolución dinámica
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # CORS GLOBAL
        add_header Access-Control-Allow-Origin "http://app-alb-1381202935.us-east-1.elb.amazonaws.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Configuración común para proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HEALTH CHECK (Para el Load Balancer de AWS)
        location /health {
            return 200 "NGINX OK\n";
        }

        # 🔐 NEXTAUTH (FRONTEND)
        location /api/auth/ {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }

        # MICROSERVICIOS CON RESOLUCIÓN DINÁMICA
        location /auth/ {
            set $target auth-service;
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://$target:4004;
        }

        location /users/ {
            set $target users-service;
            rewrite ^/users/(.*)$ /$1 break;
            proxy_pass http://$target:4007;
        }

        location /posts/ {
            set $target posts-service;
            rewrite ^/posts/(.*)$ /$1 break;
            proxy_pass http://$target:4002;
        }

        location /profile/ {
            set $target profile-service;
            rewrite ^/profile/(.*)$ /$1 break;
            proxy_pass http://$target:4005;
        }

        location /requests/ {
            set $target requests-service;
            rewrite ^/requests/(.*)$ /$1 break;
            proxy_pass http://$target:4003;
        }

        location /notifications/ {
            set $target notification-service;
            rewrite ^/notifications/(.*)$ /$1 break;
            proxy_pass http://$target:4001;
        }

        # FRONTEND (Ruta raíz)
        location / {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }
    }
}