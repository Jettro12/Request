events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Inyectado por Terraform para evitar errores de CORS
        add_header Access-Control-Allow-Origin "http://INSERT_ALB_DNS_HERE" always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 🔐 RUTAS DE LA API (Con prefijo /api/)
        # Esto evita que choquen con las páginas del frontend
        
        location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /api/posts/ {
            rewrite ^/api/posts/(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /api/requests/ {
            rewrite ^/api/requests/(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /api/profile/ {
            rewrite ^/api/profile/(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        # 🔐 NEXTAUTH (Rutas internas de Next.js, deben ir al frontend)
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # 🌐 FRONTEND (Páginas y navegación)
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}