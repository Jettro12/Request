events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Configuración Global de Cabeceras (Inyectado por Terraform)
        add_header Access-Control-Allow-Origin "http://INSERT_ALB_DNS_HERE" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Configuración Global de Proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ HEALTH CHECK (Para el Load Balancer de AWS)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # 🔐 RUTAS DE LA API (Con prefijo /api/)
        location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /api/posts/ {
            rewrite ^/api/posts/(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /api/requests/ {
            rewrite ^/api/requests/(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /api/profile/ {
            rewrite ^/api/profile/(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        # 🔐 NEXTAUTH (Rutas internas de Next.js)
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # 🌐 FRONTEND (Páginas y navegación)
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}