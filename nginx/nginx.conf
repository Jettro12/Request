events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    
    # Resolver de Docker para comunicación interna
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Configuración Global de Proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte para WebSockets (Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 🛠️ CORS GLOBAL
        set $cors_origin "http://app-alb-2083871022.us-east-1.elb.amazonaws.com";

        # ✅ HEALTH CHECK
        location /health {
            access_log off;
            return 200 "OK";
        }

        # 🔐 RUTAS DE LA API (Solo con prefijo /api/)
        
        location /api/users/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /api/posts/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/posts/(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /api/requests/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/requests/(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /api/profile/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/profile/(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        location /api/notifications/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/notifications/(.*) /$1 break;
            proxy_pass http://notification-service:4001;
        }

        location /api/chat/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/chat/(.*) /$1 break;
            proxy_pass http://chat-service:4010;
        }

        location /api/messages/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/messages/(.*) /$1 break;
            proxy_pass http://messages-service:4008;
        }

        location /api/conversations/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/conversations/(.*) /$1 break;
            proxy_pass http://conversations-service:4009;
        }

        location /api/ratings/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            rewrite ^/api/ratings/(.*) /$1 break;
            proxy_pass http://ratings-service:4006;
        }

        location /api/auth-custom/ {
            # Si usas un microservicio de auth aparte de NextAuth
            add_header Access-Control-Allow-Origin $cors_origin always;
            rewrite ^/api/auth-custom/(.*) /$1 break;
            proxy_pass http://auth-service:4004;
        }

        # 🔐 RUTAS ESPECIALES NEXTAUTH Y FRONTEND
        
        # NextAuth necesita /api/auth para sus callbacks internos
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # Todas las demás rutas van al Frontend (Páginas)
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}