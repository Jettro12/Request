events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    
    # DNS interno de Docker para resolver nombres de contenedores
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Configuración base de Proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte para WebSockets (Necesario para Chat-Service)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 🛠️ CORS GLOBAL - DNS actual de tu Load Balancer
        set $cors_origin "http://app-alb-665076499.us-east-1.elb.amazonaws.com";

        # ✅ HEALTH CHECK
        location /health {
            access_log off;
            return 200 "OK";
        }

        # 🔐 RUTAS DE MICROSERVICIOS (Mapeo 1:1 con Docker Compose)

      location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /api/posts {
            rewrite ^/api/posts/?(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /api/requests {
            rewrite ^/api/requests/?(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /api/profile {
            rewrite ^/api/profile/?(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        location /api/notifications {
            rewrite ^/api/notifications/?(.*) /$1 break;
            proxy_pass http://notification-service:4001;
        }

        location /api/chat {
            rewrite ^/api/chat/?(.*) /$1 break;
            proxy_pass http://chat-service:4010;
        }

        location /api/messages {
            rewrite ^/api/messages/?(.*) /$1 break;
            proxy_pass http://messages-service:4008;
        }

        location /api/conversations {
            rewrite ^/api/conversations/?(.*) /$1 break;
            proxy_pass http://conversations-service:4009;
        }

        location /api/ratings {
            rewrite ^/api/ratings/?(.*) /$1 break;
            proxy_pass http://ratings-service:4006;
        }

        location /api/auth-custom {
            rewrite ^/api/auth-custom/?(.*) /$1 break;
            proxy_pass http://auth-service:4004;
        }
        location /api/auth/register {
            rewrite ^/api/auth/register/?(.*) /register break;
            proxy_pass http://auth-service:4004;
        }

        # 🔐 NEXTAUTH (Rutas internas manejadas por Next.js)
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # 🌐 FRONTEND (Maneja las páginas y rutas no capturadas arriba)
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}