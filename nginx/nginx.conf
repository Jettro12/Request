events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # 🛠️ CORS GLOBAL
        set $cors_origin "http://INSERT_ALB_DNS_HERE";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            return 204;
        }

        # Configuración Global de Proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ HEALTH CHECK
        location /health {
            access_log off;
            return 200 "OK";
        }

        # 🔐 RUTAS DE LA API (Microservicios)
        location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /api/posts/ {
            rewrite ^/api/posts/(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /api/requests/ {
            rewrite ^/api/requests/(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /api/profile/ {
            rewrite ^/api/profile/(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        # 🔔 NOTIFICACIONES
        location /api/notifications/ {
            rewrite ^/api/notifications/(.*) /$1 break;
            proxy_pass http://notification-service:4001;
        }

        # 💬 CHAT, MENSAJES Y CONVERSACIONES
        location /api/chat/ {
            rewrite ^/api/chat/(.*) /$1 break;
            proxy_pass http://chat-service:4010;
        }

        location /api/messages/ {
            rewrite ^/api/messages/(.*) /$1 break;
            proxy_pass http://messages-service:4008;
        }

        location /api/conversations/ {
            rewrite ^/api/conversations/(.*) /$1 break;
            proxy_pass http://conversations-service:4009;
        }

        # ⭐️ RATINGS
        location /api/ratings/ {
            rewrite ^/api/ratings/(.*) /$1 break;
            proxy_pass http://ratings-service:4006;
        }

        # 🔐 NEXTAUTH (Rutas internas de Next.js)
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # 🌐 FRONTEND
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}