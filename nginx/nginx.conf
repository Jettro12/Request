events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ======================
    # UPSTREAMS
    # ======================
    upstream frontend {
        server frontend:3000;
    }

    upstream auth {
        server auth-service:4004;
    }

    upstream users {
        server users-service:4007;
    }

    upstream posts {
        server posts-service:4002;
    }

    upstream requests {
        server requests-service:4003;
    }

    upstream notifications {
        server notification-service:4001;
    }

    upstream profile {
        server profile-service:4005;
    }

    upstream ratings {
        server ratings-service:4006;
    }

    upstream messages {
        server messages-service:4008;
    }

    upstream conversations {
        server conversations-service:4009;
    }

    server {
        listen 80;
        server_name localhost;

        # ======================
        # CORS GLOBAL (SOLO AQUÍ)
        # ======================
        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ======================
        # 🔐 NEXTAUTH (FRONTEND)
        # ======================
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # ======================
        # FRONTEND (Next.js)
        # ======================
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ======================
        # MICROSERVICIOS
        # ======================
        location /auth/ {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://auth;
            proxy_set_header Host $host;
        }

        location /users/ {
            rewrite ^/users/(.*)$ /$1 break;
            proxy_pass http://users;
            proxy_set_header Host $host;
        }

        location /posts/ {
            rewrite ^/posts/(.*)$ /$1 break;
            proxy_pass http://posts;
            proxy_set_header Host $host;
        }

        location /requests/ {
            rewrite ^/requests/(.*)$ /$1 break;
            proxy_pass http://requests;
            proxy_set_header Host $host;
        }

        location /notifications/ {
            rewrite ^/notifications/(.*)$ /$1 break;
            proxy_pass http://notifications;
            proxy_set_header Host $host;
        }

        location /profile/ {
            rewrite ^/profile/(.*)$ /$1 break;
            proxy_pass http://profile;
            proxy_set_header Host $host;
        }

        location /ratings/ {
            rewrite ^/ratings/(.*)$ /$1 break;
            proxy_pass http://ratings;
            proxy_set_header Host $host;
        }

        location /messages/ {
            rewrite ^/messages/(.*)$ /$1 break;
            proxy_pass http://messages;
            proxy_set_header Host $host;
        }

        location /conversations/ {
            rewrite ^/conversations/(.*)$ /$1 break;
            proxy_pass http://conversations;
            proxy_set_header Host $host;
        }

        # ======================
        # HEALTH CHECK
        # ======================
        location /health {
            return 200 "NGINX OK\n";
        }
    }
}
