events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # CORS dinámico (inyectado por Terraform)
        add_header Access-Control-Allow-Origin "http://INSERT_ALB_DNS_HERE" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /health { return 200 "NGINX OK\n"; }

        # 🔐 NEXTAUTH (Rutas internas de Next.js)
        location /api/auth/ {
            proxy_pass http://frontend:3000;
        }

        # ===== MICROSERVICIOS (API PURA CON REWRITE) =====

        location /users/ {
            rewrite ^/users/(.*) /$1 break;
            proxy_pass http://users-service:4007;
        }

        location /posts/ {
            rewrite ^/posts/(.*) /$1 break;
            proxy_pass http://posts-service:4002;
        }

        location /requests/ {
            rewrite ^/requests/(.*) /$1 break;
            proxy_pass http://requests-service:4003;
        }

        location /notifications/ {
            rewrite ^/notifications/(.*) /$1 break;
            proxy_pass http://notification-service:4001;
        }

        location /ratings/ {
            rewrite ^/ratings/(.*) /$1 break;
            proxy_pass http://ratings-service:4006;
        }

        location /messages/ {
            rewrite ^/messages/(.*) /$1 break;
            proxy_pass http://messages-service:4008;
        }

        location /conversations/ {
            rewrite ^/conversations/(.*) /$1 break;
            proxy_pass http://conversations-service:4009;
        }

        location /chat/ {
            rewrite ^/chat/(.*) /$1 break;
            proxy_pass http://chat-service:4010;
        }

        location /profile/ {
            rewrite ^/profile/(.*) /$1 break;
            proxy_pass http://profile-service:4005;
        }

        location /auth/ {
            rewrite ^/auth/(.*) /$1 break;
            proxy_pass http://auth-service:4004;
        }

        # ===== FRONTEND (Páginas y estáticos) =====
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}