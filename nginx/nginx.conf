events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # DNS interno de Docker para resolución dinámica
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # El marcador INSERT_ALB_DNS_HERE será reemplazado por Terraform
        add_header Access-Control-Allow-Origin "http://INSERT_ALB_DNS_HERE" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HEALTH CHECK para AWS
        location /health {
            return 200 "NGINX OK\n";
        }

        # 🔐 NEXTAUTH (FRONTEND)
        location /api/auth/ {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }

        # --- MICROSERVICIOS CON SOPORTE PARA QUERY PARAMS ---
        
        location ~ ^/auth(/?)(.*) {
            set $target auth-service;
            proxy_pass http://$target:4004/$2$is_args$args;
        }

        location ~ ^/users(/?)(.*) {
            set $target users-service;
            proxy_pass http://$target:4007/$2$is_args$args;
        }

        location ~ ^/posts(/?)(.*) {
            set $target posts-service;
            proxy_pass http://$target:4002/$2$is_args$args;
        }

        location ~ ^/profile(/?)(.*) {
            set $target profile-service;
            proxy_pass http://$target:4005/$2$is_args$args;
        }

        location ~ ^/requests(/?)(.*) {
            set $target requests-service;
            proxy_pass http://$target:4003/$2$is_args$args;
        }

        location ~ ^/notifications(/?)(.*) {
            set $target notification-service;
            proxy_pass http://$target:4001/$2$is_args$args;
        }

        # RUTA RAÍZ (FRONTEND)
        location / {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }
    }
}