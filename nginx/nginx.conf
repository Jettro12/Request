events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # CORS dinámico (inyectado por Terraform)
        add_header Access-Control-Allow-Origin "http://INSERT_ALB_DNS_HERE" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /health { return 200 "NGINX OK\n"; }

        # 🔐 NEXTAUTH
        location /api/auth/ {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }

        # --- LÓGICA DE RUTAS: FRONTEND VS BACKEND ---
        # Se verifica si la petición es de datos (POST/PUT/PATCH o trae _rsc de Next.js)
        # De lo contrario, se sirve el Frontend para ver la interfaz.

        location ~ ^/(auth|users|posts|profile|requests|notifications|ratings|messages|conversations|chat)(/?)(.*)$ {
            set $svc_name $1;
            set $remaining $3;
            set $target "$1-service";

            # Si trae parámetro _rsc o no es un GET, va al Microservicio
            if ($args ~ "_rsc=") {
                proxy_pass http://$target:4000/$remaining$is_args$args;
                # Nota: El puerto 4000 es genérico aquí, Nginx usará el mapeado abajo:
            }
            if ($request_method != GET) {
                proxy_pass http://$target-link/$remaining$is_args$args;
            }

            # Bloques específicos para asegurar puertos correctos
            location ~ ^/auth(/?)(.*)$ {
                set $t auth-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4004/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4004/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/users(/?)(.*)$ {
                set $t users-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4007/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4007/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/posts(/?)(.*)$ {
                set $t posts-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4002/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4002/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/profile(/?)(.*)$ {
                set $t profile-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4005/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4005/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/requests(/?)(.*)$ {
                set $t requests-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4003/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4003/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/notifications(/?)(.*)$ {
                set $t notification-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4001/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4001/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/ratings(/?)(.*)$ {
                set $t ratings-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4006/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4006/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/messages(/?)(.*)$ {
                set $t messages-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4008/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4008/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/conversations(/?)(.*)$ {
                set $t conversations-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4009/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4009/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }
            location ~ ^/chat(/?)(.*)$ {
                set $t chat-service;
                if ($args ~ "_rsc=") { proxy_pass http://$t:4010/$2$is_args$args; }
                if ($request_method != GET) { proxy_pass http://$t:4010/$2$is_args$args; }
                proxy_pass http://frontend:3000;
            }

            # Fallback al Frontend para cualquier navegación GET de página
            proxy_pass http://frontend:3000;
        }

        # FRONTEND (RAÍZ)
        location / {
            set $upstream_fe frontend;
            proxy_pass http://$upstream_fe:3000;
        }
    }
}