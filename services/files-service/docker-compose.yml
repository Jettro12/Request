# services/files-service/docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: files_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: files_db
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - files_network

  files-service:
    build: .
    container_name: files_service
    restart: always
    depends_on:
      - mongodb
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4010}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password@mongodb:27017/files_db?authSource=admin}
      BASE_URL: ${BASE_URL:-http://localhost:4011}
      JWT_SECRET: ${JWT_SECRET}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600} # 100MB
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm}
    ports:
      - '4011:4011'
    volumes:
      - ./uploads:/app/uploads
    networks:
      - files_network
      - app_network # Red compartida con otros servicios

networks:
  files_network:
    driver: bridge
  app_network:
    external: true

volumes:
  mongodb_data:
